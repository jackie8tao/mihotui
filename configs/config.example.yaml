# Mihomo TUI 配置文件示例
# 默认路径: ~/.config/mihomo-tui/config.yaml 或 ./configs/config.yaml 或 ./config.yaml

# Mihomo External Controller API 接口地址
api_url: "http://127.0.0.1:9090"

# Mihomo 接口密钥 (对应 mihomo config.yaml 中的 secret)
secret: ""

# Mihomo 配置文件所在目录 (用于 Profile 与订阅管理)
# 若留空，自动探测 /etc/mihomo 或 ~/.config/mihomo
config_dir: "/etc/mihomo"

# 节点延迟测速的目标 URL (推荐 gstatic 204 或 cloudflare)
test_url: "http://www.gstatic.com/generate_204"

# 测速超时时间 (毫秒)
test_timeout: 3000

# 界面刷新频率 (毫秒)
refresh_rate_ms: 1000
