# Mihomo TUI sample configuration file
# Default paths: $XDG_CONFIG_HOME/mihotui/config.yaml or ~/.config/mihotui/config.yaml

# Mihomo External Controller API URL
api_url: "http://127.0.0.1:9090"

# Mihomo API secret token (matches 'secret' in Mihomo config.yaml)
secret: ""

# Mihomo managed configuration directory (for profiles and subscription management)
# If empty, automatically managed under user config directory (e.g. ~/.config/mihotui/mihomo)
mihomo_dir: ""

# Target URL for latency/delay testing (recommended: gstatic 204 or Cloudflare)
test_url: "http://www.gstatic.com/generate_204"

# Latency test timeout in milliseconds
test_timeout: 3000

# UI refresh rate in milliseconds for traffic and status polling
refresh_rate_ms: 1000
